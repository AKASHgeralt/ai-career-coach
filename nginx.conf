server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resumes are capped at 5MB server-side; allow a little headroom for the
    # multipart envelope so nginx doesn't reject before FastAPI can explain why.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API and uploaded files go to the backend. Serving both from this origin
    # means the browser never makes a cross-origin request, so CORS isn't in
    # play for the containerised deployment.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Roadmap generation and answer evaluation call an LLM; the default
        # 60s read timeout can cut those off mid-flight.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Single-page app: unknown paths are client-side routes such as
    # /dashboard/interview, so hand them index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
